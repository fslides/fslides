<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:#FAF7F2}
body{width:1280px;height:720px;overflow:hidden;position:absolute;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#FAF7F2;color:#1c1917;display:flex;flex-direction:column;justify-content:center;padding:0 100px}
.rule{position:fixed;left:100px;right:100px;top:84px;height:1px;background:#1c1917;opacity:.15}
.rule.b{top:auto;bottom:84px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f1{opacity:0;animation:up .6s ease forwards .1s}.f2{opacity:0;animation:up .6s ease forwards .35s}.f3{opacity:0;animation:up .6s ease forwards .6s}
.kicker{font-size:.82rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#C2410C;margin-bottom:26px}
h1{font-family:'Fraunces',serif;font-size:5rem;font-weight:900;letter-spacing:-.02em;line-height:1.04;margin-bottom:26px}
h1 em{font-style:italic;color:#C2410C}
.sub{font-size:1.25rem;font-weight:300;color:rgba(28,25,23,.6);max-width:620px;line-height:1.65}
</style>
</head>
<body>
<div class="rule"></div><div class="rule b"></div>
<div class="kicker f1">An essay, spoken</div>
<h1 class="f1">A title with a little<br><em>typographic warmth</em>.</h1>
<p class="sub f2">The single idea this talk exists to land, written like the first line of a good essay.</p>
<script src="/js/fuckslides.js"></script>
<script>
(function(){if(window!==window.top)return;const W=1280,H=720;function f(){var s=Math.min(innerWidth/W,innerHeight/H);document.body.style.transform='scale('+s+')';document.body.style.transformOrigin='0 0';document.body.style.left=((innerWidth-W*s)/2)+'px';document.body.style.top=((innerHeight-H*s)/2)+'px'}f();addEventListener('resize',f)})();
</script>
</body>
</html>
