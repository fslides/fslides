<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck — Thank You</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:#FAF7F2}
body{width:1280px;height:720px;overflow:hidden;position:absolute;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#FAF7F2;color:#1c1917;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f1{opacity:0;animation:up .6s ease forwards .15s}.f2{opacity:0;animation:up .6s ease forwards .45s}
h1{font-family:'Fraunces',serif;font-size:5.2rem;font-weight:900;font-style:italic;color:#C2410C;margin-bottom:22px}
.sub{font-size:1.2rem;font-weight:300;color:rgba(28,25,23,.6)}
</style>
</head>
<body>
<h1 class="f1">Merci.</h1>
<p class="sub f2">Questions, disagreements, and better ideas welcome.</p>
<script src="/js/fuckslides.js"></script>
<script>
(function(){if(window!==window.top)return;const W=1280,H=720;function f(){var s=Math.min(innerWidth/W,innerHeight/H);document.body.style.transform='scale('+s+')';document.body.style.transformOrigin='0 0';document.body.style.left=((innerWidth-W*s)/2)+'px';document.body.style.top=((innerHeight-H*s)/2)+'px'}f();addEventListener('resize',f)})();
</script>
</body>
</html>
