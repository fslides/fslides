name = "fslides-site"
main = "src/index.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "fslides.dev", custom_domain = true },
  { pattern = "www.fslides.dev", custom_domain = true },
  { pattern = "decks.fslides.dev", custom_domain = true }
]

[assets]
directory = "_site"
binding = "ASSETS"

[vars]
PUBLISHERS = "bahaaldine,fslides"

# player/runtime/logo vendored from packages/core (npm run sync-vendor)
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
