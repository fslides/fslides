<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fslides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* profile pages carry both palettes; default follows the viewer's clock */
    :root, [data-theme="dark"] {
      --bg: #0d0f14; --panel: #12151c; --panel2: #171b24; --line: rgba(255,255,255,0.09);
      --fg: #e8eaf0; --dim: rgba(232,234,240,0.55); --faint: rgba(232,234,240,0.3);
      --acc: #F05000; --acc-hi: #FF6A1A;
    }
    [data-theme="light"] {
      --bg: #f6f5f2; --panel: #ffffff; --panel2: #efede8; --line: rgba(20,20,30,0.12);
      --fg: #171922; --dim: rgba(23,25,34,0.6); --faint: rgba(23,25,34,0.35);
      --acc: #E04800; --acc-hi: #F05000;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
      background: var(--bg); color: var(--fg); min-height: 100vh;
      display: flex; flex-direction: column;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(color-mix(in srgb, var(--acc) 6%, transparent) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    ::selection { background: var(--acc); color: #fff; }
    a { color: inherit; text-decoration: none; }
    code, .mono { font-family: 'JetBrains Mono', monospace; }

    .bar {
      display: flex; align-items: center; gap: 22px; padding: 0 22px; height: 52px;
      border-bottom: 1px solid var(--line); background: var(--panel);
      position: sticky; top: 0; z-index: 10;
    }
    .wordmark { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.95rem; }
    .wordmark .p { color: var(--acc); }
    .wordmark .caret { display: inline-block; width: 8px; height: 15px; background: var(--acc); vertical-align: -2px; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar nav { display: flex; gap: 18px; margin-left: auto; align-items: center; }
    .bar nav a { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--dim); }
    .bar nav a:hover { color: var(--acc); }
    #theme-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; cursor: pointer;
      background: none; border: 1px solid var(--line); color: var(--dim); padding: 5px 10px;
    }
    #theme-btn:hover { color: var(--acc); border-color: var(--acc); }

    .wrap { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 34px 70px; display: flex; gap: 44px; align-items: flex-start; }

    /* left column — the human */
    .who { width: 280px; flex-shrink: 0; position: sticky; top: 86px; }
    .who img.avatar {
      width: 100%; aspect-ratio: 1; border: 1px solid var(--line); background: var(--panel2);
      display: block;
    }
    .who h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 18px; }
    .who .login { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--acc); margin-top: 2px; }
    .who .bio { font-size: 0.9rem; color: var(--dim); line-height: 1.55; margin-top: 12px; }
    .who .meta { margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
    .who .meta div { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--dim); }
    .who .meta b { color: var(--fg); font-weight: 700; }
    .who .gh {
      display: inline-block; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      color: var(--dim); border: 1px solid var(--line); padding: 7px 12px;
    }
    .who .gh:hover { color: var(--acc); border-color: var(--acc); }
    .who .gh::before { content: '[ '; color: var(--acc); } .who .gh::after { content: ' ]'; color: var(--acc); }

    /* right column — the decks */
    .decks { flex: 1; min-width: 0; }
    .decks h2 { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
    .decks h2::before { content: '## '; color: var(--acc); }
    .decks h2 .count { color: var(--faint); font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { border: 1px solid var(--line); background: var(--panel); display: block; transition: border-color .12s; }
    .card:hover { border-color: var(--acc); }
    .thumb { position: relative; width: 100%; padding-bottom: 56.25%; background: var(--panel2); overflow: hidden; }
    .thumb iframe {
      position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
      border: none; transform-origin: top left; pointer-events: none;
    }
    .card .info { padding: 13px 15px; border-top: 1px solid var(--line); }
    .card .name { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; }
    .card .name::before { content: '> '; color: var(--acc); }
    .card .desc { font-size: 0.8rem; color: var(--dim); line-height: 1.45; margin-top: 5px; min-height: 1.2em; }
    .card .when { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--faint); margin-top: 9px; }

    .state { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--dim); padding: 60px 0; text-align: center; }
    .state a { color: var(--acc); }
    .state .big { font-size: 1.1rem; color: var(--fg); margin-bottom: 10px; }

    .statusline {
      display: flex; align-items: center; height: 30px; border-top: 1px solid var(--line);
      background: var(--panel); font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--dim);
      padding: 0 14px; gap: 14px;
    }
    .statusline .mode { background: var(--acc); color: #fff; font-weight: 700; padding: 2px 8px; }
    .statusline .right { margin-left: auto; }

    @media (max-width: 860px) {
      .wrap { flex-direction: column; }
      .who { width: 100%; position: static; display: flex; gap: 20px; align-items: flex-start; }
      .who img.avatar { width: 110px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/"><span class="p">$</span> fslides<span class="caret"></span></a>
    <nav>
      <a href="/docs/">docs</a>
      <a href="/templates/">templates</a>
      <a href="/dashboard/">~/decks</a>
      <button id="theme-btn" title="toggle light/dark (auto-set by your local time)">:set bg?</button>
    </nav>
  </header>

  <main class="wrap" id="main" hidden>
    <aside class="who">
      <img class="avatar" id="avatar" alt="">
      <div>
        <h1 id="name"></h1>
        <div class="login mono" id="login"></div>
        <p class="bio" id="bio"></p>
        <div class="meta" id="meta"></div>
        <a class="gh" id="gh-link" target="_blank" rel="noopener">github ↗</a>
      </div>
    </aside>
    <section class="decks">
      <h2>decks <span class="count" id="count"></span></h2>
      <div class="grid" id="grid"></div>
      <div class="state" id="empty" hidden>
        <div class="big">no public decks yet</div>
        <div>make one: <a href="/">curl -fsSL fslides.dev/new | sh -s -- my-deck</a></div>
      </div>
    </section>
  </main>
  <div class="state" id="loading">loading profile…</div>
  <div class="state" id="notfound" hidden>
    <div class="big">404 — no such GitHub user</div>
    <div><a href="/">← fslides.dev</a></div>
  </div>

  <footer class="statusline">
    <span class="mode" id="mode-block">PROFILE</span>
    <span id="status-user"></span>
    <span class="right">decks render live from GitHub · <span id="clock"></span></span>
  </footer>

<script>
(function () {
  // ── theme: follow the viewer's clock, remember an explicit choice ──
  var saved = localStorage.getItem('fs-theme');
  var hour = new Date().getHours();
  var auto = (hour >= 7 && hour < 19) ? 'light' : 'dark';
  var theme = saved || auto;
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('fs-theme', theme);
  });

  var login = location.pathname.split('/').filter(Boolean)[0];
  document.title = login + ' — fslides';
  document.getElementById('status-user').textContent = 'fslides.dev/' + login;
  document.getElementById('clock').textContent =
    String(hour).padStart(2, '0') + ':' + String(new Date().getMinutes()).padStart(2, '0');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ago(iso) {
    var d = (Date.now() - new Date(iso)) / 864e5;
    if (d < 1) return 'today'; if (d < 2) return 'yesterday';
    if (d < 30) return Math.floor(d) + 'd ago'; if (d < 365) return Math.floor(d / 30) + 'mo ago';
    return Math.floor(d / 365) + 'y ago';
  }

  Promise.all([
    fetch('https://api.github.com/users/' + encodeURIComponent(login)).then(function (r) { return r.ok ? r.json() : null; }),
    fetch('https://api.github.com/search/repositories?q=user:' + encodeURIComponent(login) + '+topic:fslides&sort=updated&per_page=100')
      .then(function (r) { return r.ok ? r.json() : { items: [] }; }),
  ]).then(function (res) {
    var user = res[0], decks = (res[1].items || []).filter(function (r) { return !r.private; });
    document.getElementById('loading').hidden = true;
    if (!user) { document.getElementById('notfound').hidden = false; return; }

    document.getElementById('main').hidden = false;
    document.getElementById('avatar').src = user.avatar_url;
    document.getElementById('name').textContent = user.name || user.login;
    document.getElementById('login').textContent = '@' + user.login;
    document.getElementById('bio').textContent = user.bio || '';
    document.getElementById('gh-link').href = user.html_url;
    var meta = [];
    meta.push('<div><b>' + decks.length + '</b> deck' + (decks.length === 1 ? '' : 's') + '</div>');
    if (user.followers != null) meta.push('<div><b>' + user.followers + '</b> followers</div>');
    if (user.location) meta.push('<div>' + esc(user.location) + '</div>');
    document.getElementById('meta').innerHTML = meta.join('');
    document.getElementById('count').textContent = '(' + decks.length + ')';

    if (!decks.length) { document.getElementById('empty').hidden = false; return; }
    var grid = document.getElementById('grid');
    decks.forEach(function (r) {
      var url = 'https://decks.fslides.dev/' + r.owner.login + '/' + r.name + '/';
      var a = document.createElement('a');
      a.className = 'card'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<div class="thumb"><iframe loading="lazy" scrolling="no" tabindex="-1"></iframe></div>' +
        '<div class="info"><div class="name">' + esc(r.name) + '</div>' +
        '<div class="desc">' + esc(r.description || '') + '</div>' +
        '<div class="when">pushed ' + ago(r.pushed_at) + '</div></div>';
      a.querySelector('iframe').src = url + '#0';
      grid.appendChild(a);
    });
    function fit() {
      grid.querySelectorAll('.thumb').forEach(function (t) {
        t.querySelector('iframe').style.transform = 'scale(' + (t.clientWidth / 1280) + ')';
      });
    }
    fit(); window.addEventListener('resize', fit);
  });
})();
</script>
</body>
</html>
