<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>~/decks — fslides</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0f14; color: rgba(232,234,240,0.7); min-height: 100vh; margin: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: 'JetBrains Mono', monospace; font-size: 1rem;
    }
    a, button {
      font-family: inherit; font-size: 1rem; color: #F05000; background: none;
      border: 1px solid rgba(255,255,255,0.15); padding: 10px 18px; cursor: pointer;
    }
    button:hover { border-color: #F05000; }
  </style>
</head>
<body>
  <!-- your profile is your dashboard now: fslides.dev/you -->
  <div id="msg">taking you to your profile…</div>
  <button id="btn" hidden>[ sign in with github ]</button>
<script>
  var GATEWAY = 'https://api.fslides.dev';
  function token() {
    try {
      var exp = parseInt(localStorage.getItem('fs-gh-token-exp') || '0', 10);
      if (exp && Date.now() > exp) return '';
      return localStorage.getItem('fs-gh-token') || '';
    } catch (_) { return ''; }
  }
  function go(tok) {
    fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' } })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (me) { location.replace('/' + me.login); })
      .catch(ask);
  }
  function ask() {
    document.getElementById('msg').textContent = 'your profile is your dashboard — sign in to get there';
    document.getElementById('btn').hidden = false;
  }
  document.getElementById('btn').addEventListener('click', function () {
    var w = 640, h = 780, x = (screen.width - w) / 2, y = (screen.height - h) / 2;
    window.open(GATEWAY + '/auth/login?origin=' + encodeURIComponent(location.origin) + '&t=' + Date.now(),
      'fslides-auth', 'width=' + w + ',height=' + h + ',left=' + x + ',top=' + y);
  });
  window.addEventListener('message', function (e) {
    if (e.origin !== new URL(GATEWAY).origin || !e.data || e.data.type !== 'fslides-auth') return;
    try {
      localStorage.setItem('fs-gh-token', e.data.token);
      localStorage.setItem('fs-gh-token-exp', String(e.data.expiresAt || 0));
    } catch (_) {}
    go(e.data.token);
  });
  var t = token();
  if (t) go(t); else ask();
</script>
</body>
</html>
