<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fslides — get started</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { width: 100%; height: 100%; overflow: hidden; background: #0d0f14; }
    body {
      width: 1280px; height: 720px; overflow: hidden; position: absolute;
      font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
      background: #0d0f14; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(rgba(56,189,248,0.05) 1px, transparent 1px);
      background-size: 30px 30px; pointer-events: none;
    }
    @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .f1 { opacity:0; animation: up .5s ease forwards .1s; }
    .f2 { opacity:0; animation: up .5s ease forwards .3s; }
    .f3 { opacity:0; animation: up .5s ease forwards .5s; }

    h1 { font-size: 3.4rem; font-weight: 900; letter-spacing: -0.035em; margin-bottom: 40px; }
    h1 span { color: #38BDF8; }

    .term {
      font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
      background: #16181f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      padding: 24px 34px; line-height: 2.2; text-align: left;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); margin-bottom: 44px;
    }
    .term .p { color: #38BDF8; }
    .term .c { color: rgba(255,255,255,0.3); }

    .links { display: flex; gap: 16px; }
    .links a {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 13px 26px; border-radius: 10px; text-decoration: none;
      font-size: 1rem; font-weight: 700;
    }
    .links a.primary { background: #38BDF8; color: #0d0f14; }
    .links a.ghost { border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.85); }
    .links a.ghost:hover { border-color: #38BDF8; color: #fff; }
  </style>
</head>
<body>
  <h1 class="f1">Your next deck is <span>three commands away</span>.</h1>
  <div class="term f2">
    <span class="p">$</span> npm install -g fslides<br>
    <span class="p">$</span> fslides scaffold my-deck    <span class="c"># GitHub repo + CI + Pages, wired</span><br>
    <span class="p">$</span> cd my-deck &amp;&amp; fslides serve  <span class="c"># author, record, present</span>
  </div>
  <div class="links f3">
    <a class="primary" href="https://github.com/fslides/fslides" target="_blank" rel="noopener">GitHub ↗</a>
    <a class="ghost" href="https://www.npmjs.com/package/fslides" target="_blank" rel="noopener">npm ↗</a>
    <a class="ghost" href="/docs/">Docs</a>
    <a class="ghost" href="/templates/">Templates</a>
    <a class="ghost" href="https://bahaaldine.github.io/test-deck/" target="_blank" rel="noopener">Example deck ↗</a>
  </div>
<script src="/js/fuckslides.js"></script>
<script>
(function scaleToFit() {
  if (window !== window.top) return;
  const W = 1280, H = 720;
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    document.body.style.transform = 'scale(' + s + ')';
    document.body.style.transformOrigin = '0 0';
    document.body.style.left = ((window.innerWidth - W * s) / 2) + 'px';
    document.body.style.top = ((window.innerHeight - H * s) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
