<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck — The Number</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:#22242C}
body{width:1280px;height:720px;overflow:hidden;position:absolute;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#22242C;color:#fff;display:flex;align-items:center;gap:70px;padding:0 90px}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.bar{position:fixed;top:0;left:0;width:5px;height:100%;background:#00BFB3}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f1{opacity:0;animation:up .5s ease forwards .1s}.f2{opacity:0;animation:up .5s ease forwards .35s}
.num{font-family:'JetBrains Mono',monospace;font-size:9rem;font-weight:900;letter-spacing:-.05em;color:#00BFB3;line-height:1;text-shadow:0 0 60px rgba(0,191,179,.35)}
.numlbl{font-size:1rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:14px}
.right{flex:1}
h2{font-size:2.2rem;font-weight:900;letter-spacing:-.025em;line-height:1.15;margin-bottom:26px}
ul{list-style:none;display:flex;flex-direction:column;gap:14px}
li{font-size:1.1rem;font-weight:300;color:rgba(255,255,255,.7);display:flex;gap:14px;line-height:1.5}
li::before{content:'→';color:#00BFB3;font-weight:700}
</style>
</head>
<body>
<div class="bar"></div>
<div class="f1"><div class="num">6.6×</div><div class="numlbl">the headline metric</div></div>
<div class="right f2">
<h2>Lead with the number.<br>Then earn it.</h2>
<ul>
<li>First supporting point — the mechanism behind the number</li>
<li>Second point — why it holds at scale</li>
<li>Third point — what it means for the audience</li>
</ul>
</div>
<script src="/js/fuckslides.js"></script>
<script>
(function(){if(window!==window.top)return;const W=1280,H=720;function f(){var s=Math.min(innerWidth/W,innerHeight/H);document.body.style.transform='scale('+s+')';document.body.style.transformOrigin='0 0';document.body.style.left=((innerWidth-W*s)/2)+'px';document.body.style.top=((innerHeight-H*s)/2)+'px'}f();addEventListener('resize',f)})();
</script>
</body>
</html>
