<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fslides — slides are code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { width: 100%; height: 100%; overflow: hidden; background: #0d0f14; }
    body {
      width: 1280px; height: 720px; overflow: hidden; position: absolute;
      font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
      background: #0d0f14; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(rgba(240,80,0,0.05) 1px, transparent 1px);
      background-size: 30px 30px; pointer-events: none;
    }
    @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .f1 { opacity:0; animation: up .5s ease forwards .1s; }
    .f2 { opacity:0; animation: up .5s ease forwards .25s; }
    .f3 { opacity:0; animation: up .5s ease forwards .45s; }
    .f4 { opacity:0; animation: up .5s ease forwards .65s; }

    .wordmark {
      font-size: 6.5rem; font-weight: 900; letter-spacing: -0.05em; line-height: 1;
      background: linear-gradient(120deg, #fff 30%, #F05000);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 18px;
    }
    .tagline { font-size: 1.6rem; font-weight: 300; color: rgba(255,255,255,0.75); letter-spacing: -0.01em; margin-bottom: 40px; }
    .tagline strong { font-weight: 800; color: #fff; }

    .term {
      font-family: 'JetBrains Mono', monospace; font-size: 1.05rem;
      background: #16181f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      padding: 18px 30px; color: rgba(255,255,255,0.85);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: left; line-height: 2;
    }
    .term .p { color: #F05000; }
    .term .c { color: rgba(255,255,255,0.3); }

    .hint { margin-top: 44px; font-size: 0.85rem; color: rgba(255,255,255,0.3); }
    .hint kbd {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="wordmark f1">fslides</div>
  <div class="tagline f2">The presentation framework that <strong>lives in your repo</strong>.</div>
  <div class="term f3"><span class="p">$</span> npm install -g fslides<br><span class="p">$</span> fslides scaffold my-deck   <span class="c"># repo + CI + live URL, one command</span></div>
  <div class="hint f4">this site is an fslides deck — press <kbd>→</kbd> to see what that means</div>
<script src="/js/fuckslides.js"></script>
<script>
(function scaleToFit() {
  if (window !== window.top) return;
  const W = 1280, H = 720;
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    document.body.style.transform = 'scale(' + s + ')';
    document.body.style.transformOrigin = '0 0';
    document.body.style.left = ((window.innerWidth - W * s) / 2) + 'px';
    document.body.style.top = ((window.innerHeight - H * s) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
