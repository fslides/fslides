# Issue-driven development: mention @claude in any issue or PR comment and
# Claude Code runs here with repo access — implements on a branch, opens a
# PR, answers in the thread. The issue body is the prompt; comments are the
# iterations.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --system-prompt "You are working on fslides (real name: Fuckslides) — slides-as-code. Read ROADMAP.md first: it is the source of truth and must be updated in the same commit as any feature work. Design rules: orange #F05000, terminal identity, mono UI text >=0.88rem (Baha rejects small fonts), the barbed-bat logo in every bar, interactions consistent across pages (the + new deck CTA menu is THE creation surface). The site deploys from packages/site (npm run sync-vendor before building), the gateway from packages/gateway. Every PR gets an automatic staging preview URL — mention it in your PR description."
